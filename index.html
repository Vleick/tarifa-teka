<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador Tarifa TEKA</title>
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Maquetación: cabecera roja fija con buscador; debajo, tarjetas a una columna. */
:root {
  --red: #c8102e; --red-d: #a60d26; --black: #111111;
  --bg: #f1f1f2; --card: #ffffff; --fg: #111111; --muted: #6b6b70; --line: #e3e3e6;
  --soft: #f2f2f3; --dark-card: #111111; --dark-fg: #ffffff; --dark-muted: #c9c9cf;
  --accent-on-dark: #ff8fa0; --ok: #1d6f42; --wa: #1a7f4b;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0f; --card: #1a1a1d; --fg: #f3f3f5; --muted: #a2a2a9; --line: #2a2a2e;
    --soft: #232327; --dark-card: #050506; --red: #e0283f; --ok: #4cc38a; --wa: #4cc38a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font);
  min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom, 0px);
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
[hidden] { display: none !important; }

/* ---- cabecera ---- */
.top { position: sticky; top: 0; z-index: 20; background: #c8102e; color: #fff;
  padding-top: env(safe-area-inset-top, 0px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.bar { display: flex; align-items: center; gap: 12px; height: 52px;
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.bar img.logo { height: 22px; width: auto; display: block; }
.bar .sp { flex: 1; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.ibtn:active { background: rgba(255,255,255,.18); }
.ibtn svg { width: 22px; height: 22px; }
.sbox { padding: 0 max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px)); }
.field { position: relative; display: flex; align-items: center; background: #fff; border-radius: 14px;
  height: 50px; box-shadow: 0 2px 0 rgba(0,0,0,.14); }
.field > svg.lens { width: 20px; height: 20px; margin-left: 14px; color: #8a8a90; flex: none; }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
  font: 500 16px var(--font); color: #111; padding: 0 8px 0 10px; }
.field input::placeholder { color: #8a8a90; font-weight: 400; }
.field .fbtn { width: 46px; height: 100%; display: grid; place-items: center; color: var(--red-d); flex: none; }
.field .fbtn svg { width: 22px; height: 22px; }
.field .fbtn:active { background: #f3f3f4; border-radius: 12px; }
.field .sep { width: 1px; height: 26px; background: #e3e3e6; flex: none; }

/* ---- contenido ---- */
main { padding: 12px max(14px, env(safe-area-inset-right, 0px)) 28px max(14px, env(safe-area-inset-left, 0px));
  max-width: 720px; margin: 0 auto; }
.info { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 2px 10px;
  color: var(--muted); font-size: 12.5px; }
.info b { color: var(--fg); font-weight: 600; }
.info button { color: var(--red); font-weight: 700; font-size: 12.5px; padding: 6px 4px; }

.card { background: var(--card); border-radius: 16px; padding: 14px 14px 12px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line); border-top: 3px solid var(--red); }
.mrow { display: flex; align-items: flex-start; gap: 6px; }
.model { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; line-height: 1.22; letter-spacing: .01em;
  overflow-wrap: anywhere; text-transform: uppercase; }
.cp { flex: none; width: 36px; height: 36px; margin: -6px -6px 0 0; border-radius: 10px; display: grid; place-items: center; color: var(--red); }
.cp:active { background: var(--soft); }
.cp svg { width: 19px; height: 19px; }
.cp.done { color: var(--ok); }
.ids { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.id { display: flex; align-items: center; gap: 2px; min-width: 0; }
.id .lab { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.id .val { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.id .cp { width: 32px; height: 32px; margin: 0; }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.price { text-align: left; border-radius: 12px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 2px;
  position: relative; min-width: 0; }
.price.n { background: var(--soft); color: var(--fg); }
.price.a { background: var(--dark-card); color: var(--dark-fg); }
.price .pl { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .72; }
.price .pv { font-size: 22px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.price .ph { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; margin-top: 3px; color: var(--red); }
.price.a .ph { color: var(--accent-on-dark); }
.price .ph svg { width: 14px; height: 14px; }
.price:active { filter: brightness(.94); }
.price.done .ph { color: var(--ok); }
.price.a.done .ph { color: #6fe0a6; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.web { display: flex; justify-content: center; align-items: center; gap: 7px; min-width: 0; text-align: center; line-height: 1.15; font-weight: 700; font-size: 13px; color: var(--red);
  padding: 10px 6px; border-radius: 10px; text-decoration: none; box-shadow: 0 0 0 1px var(--line); }
.web:active { background: var(--soft); }
.web.zap { color: var(--wa); }
.web.b2b { grid-column: 1 / -1; color: var(--fg); }
.web svg { width: 17px; height: 17px; }
.sendmsg { display: flex; justify-content: center; align-items: center; gap: 7px; min-width: 0; text-align: center; line-height: 1.15; font-weight: 700; font-size: 13px; color: var(--wa);
  padding: 10px 6px; border-radius: 10px; text-decoration: none; box-shadow: 0 0 0 1px var(--line); }
.sendmsg:active { background: var(--soft); }
.sendmsg svg { width: 18px; height: 18px; }
.more { width: 100%; padding: 14px; border-radius: 14px; background: var(--card); color: var(--red); font-weight: 800;
  box-shadow: 0 0 0 1px var(--line); }

/* ---- vacío / bienvenida ---- */
.hello { text-align: center; padding: 26px 8px 10px; }
.hello img.big { height: 40px; width: auto; }
.hello h1 { margin: 14px 0 2px; font-size: 21px; letter-spacing: -.01em; }
.hello p.sub { margin: 0; color: var(--muted); font-size: 13px; }
.steps { list-style: none; padding: 0; margin: 20px auto 0; max-width: 340px; text-align: left; display: grid; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
.steps i { flex: none; width: 22px; height: 22px; display: grid; place-items: center; background: var(--red); color: #fff;
  font: 700 12px var(--font); font-style: normal; border-radius: 5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; background: var(--red); color: #fff;
  font-weight: 800; padding: 14px 22px; border-radius: 14px; font-size: 15px; }
.btn:active { background: var(--red-d); }
.btn.ghost { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.btn svg { width: 20px; height: 20px; }
.cta { display: flex; justify-content: center; margin-top: 22px; }
.partner { text-align: center; margin-top: 30px; color: var(--muted); font-size: 11.5px; }
.partner img { display: block; height: 26px; width: auto; margin: 10px auto 0; background: #fff; padding: 9px 16px; border-radius: 12px; box-sizing: content-box; box-shadow: 0 0 0 1px var(--line); }
.credit { text-align: center; color: var(--muted); font-size: 11px; margin: 18px 0 0; opacity: .85; }
.empty { text-align: center; padding: 34px 12px; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.sect { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 10px;
  font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sect button { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--red); font-weight: 700; padding: 4px; }

/* ---- hojas y escáner ---- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); color: var(--fg);
  border-radius: 20px 20px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: 720px; margin: 0 auto; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
.sheet h2 { margin: 0 0 4px; font-size: 18px; }
.sheet p { margin: 4px 0 12px; color: var(--muted); font-size: 13.5px; }
.sheet .row { display: grid; gap: 10px; margin-top: 14px; }
.scan { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
.scan .frame { position: absolute; left: 50%; top: 42%; width: min(78vw, 340px); height: min(36vw, 150px);
  transform: translate(-50%, -50%); border: 3px solid #fff; border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
.scan .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: var(--red); }
.scan .hint { position: absolute; left: 0; right: 0; top: calc(42% + min(22vw, 100px)); text-align: center; font-weight: 600; font-size: 14px; padding: 0 20px; }
.scan .x { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; width: 44px; height: 44px;
  border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; color: #fff; }
.scan .manual { position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.scan .manual input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 0; padding: 0 14px; font: 600 16px var(--mono); }
.scan .manual button { height: 48px; padding: 0 18px; border-radius: 12px; background: var(--red); font-weight: 800; color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: #111; color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0;
  pointer-events: none; transition: .18s; z-index: 80; display: flex; align-items: center; gap: 8px; max-width: 90vw; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 18px; height: 18px; color: #6fe0a6; flex: none; }
.prog { margin-top: 14px; height: 8px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.prog > div { height: 100%; width: 0; background: var(--red); transition: width .15s; }
:focus-visible { outline: 3px solid #ffb3be; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

/* ===================== almacenamiento (IndexedDB con respaldo en memoria) ===================== */
const mem = {};
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("teka-tarifa", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function kvGet(k) {
  try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e) { return mem[k]; }
}
async function kvSet(k, v) {
  mem[k] = v;
  try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
  catch (e) { return false; }
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

/* ===================== lectura del PDF de la tarifa ===================== */
const PRICE = String.raw`\d{1,3}(?:\.\d{3})*,\d{2}`;
const ROW_RE = new RegExp(String.raw`(\d{13})\s+(\S+)\s+(${PRICE})\s*€\s+(${PRICE})\s*€\s+(${PRICE})\s*€\s+` +
  String.raw`(.+?)(?=\d{13}\s+\S+\s+${PRICE}\s*€|\n|$)`, "g");
const TRAILING_HEADER_RE = /\s*TARIFA\s+N.?\s*\d+.*$/i;
function parseText(text) {
  const out = [];
  for (const m of text.matchAll(ROW_RE)) {
    out.push({ ean: m[1], ref: m[2], normal: m[4] + " €", asociado: m[5] + " €", modelo: m[6].replace(TRAILING_HEADER_RE, "").trim() });
  }
  return out;
}
function pageToText(content) {
  const rows = [];
  for (const it of content.items) {
    if (!it.str || !it.str.trim()) continue;
    const y = it.transform[5], x = it.transform[4];
    let row = rows.find(r => Math.abs(r.y - y) < 3);
    if (!row) { row = { y, parts: [] }; rows.push(row); }
    row.parts.push({ x, w: it.width, s: it.str });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.parts.sort((a, b) => a.x - b.x);
    let out = "", end = null;
    for (const p of r.parts) {
      if (end !== null && p.x - end > 1.5 && !out.endsWith(" ")) out += " ";
      out += p.s; end = p.x + p.w;
    }
    return out;
  }).join("\n");
}
async function readPdf(file, onProgress) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjsLib.getDocument({ data }).promise;
  let items = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    items = items.concat(parseText(pageToText(await page.getTextContent())));
    onProgress && onProgress(i, doc.numPages);
  }
  return items;
}

/* ===================== búsqueda ===================== */
function prepare(items) { for (const it of items) it._h = norm(it.ref + " " + it.ean + " " + it.modelo); return items; }
function search(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const hits = [];
  for (const it of state.items) {
    if (toks.every(t => it._h.includes(t))) {
      const first = toks[0];
      const rank = (it.ref === first || it.ean === first) ? 0 : (it.ref.startsWith(first) || it.ean.startsWith(first)) ? 1 : 2;
      hits.push([rank, it]);
    }
  }
  hits.sort((a, b) => a[0] - b[0]);
  return hits.map(h => h[1]);
}

  $("#toastTxt").textContent = msg; const t = $("#toast"); t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
const money = v => v.replace(" €", "€").trim();
function waLink(it) {

  return "https://api.whatsapp.com/send?text=" + encodeURIComponent(t);
}

function render() {
  const main = $("#main"); const q = state.q.trim();
  $("#btnClear").hidden = !q;

/* ===================== carga de tarifa ===================== */
async function loadFile(file) {
  openSheet(`<h2>Leyendo la tarifa…</h2><p id="pgTxt">Preparando…</p><div class="prog"><div id="pgBar"></div></div>`);
  try {
    const items = await readPdf(file, (i, n) => {
      const t = $("#pgTxt"), b = $("#pgBar"); if (t) t.textContent = `Página ${i} de ${n}`; if (b) b.style.width = (i / n * 100) + "%";
    });
    if (!items.length) { notice("No he encontrado artículos", "Este PDF no parece una tarifa de TEKA con el formato habitual. Prueba con el archivo original de la tarifa."); return; }
    state.items = prepare(items);
    state.meta = { name: file.name, date: Date.now() };
    state.recents = state.recents.filter(r => items.some(i => i.ref === r));
    const saved = await kvSet("tarifa", { items: items.map(({ _h, ...r }) => r), meta: state.meta });
    state.shown = PAGE; closeSheet(); render();
    toast(`${items.length} artículos cargados`);
    if (!saved) setTimeout(() => notice("Tarifa cargada sin guardar", "Tu navegador no deja guardar datos, así que tendrás que volver a cargarla la próxima vez."), 1700);
  } catch (e) {
    notice("No he podido leer el PDF", "Comprueba que es el archivo de la tarifa y vuelve a intentarlo.");
  }
}

/* ===================== escáner de códigos de barras ===================== */
let stream = null, scanTimer = null;
function stopScan() {
  clearInterval(scanTimer); scanTimer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const s = $("#scanner"); if (s) s.remove();
}
function useCode(code) { stopScan(); const i = $("#q"); i.value = code; state.q = code; state.shown = PAGE; render(); window.scrollTo(0, 0); }
async function openScan() {
  const canCam = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  const canDet = "BarcodeDetector" in window;
  const el = document.createElement("div"); el.className = "scan"; el.id = "scanner";
  el.innerHTML = `<video id="vid" playsinline muted></video><div class="frame"></div>
    <div class="hint" id="scanHint">Apunta al código de barras de la caja</div>
    <button class="x" data-act="stop-scan" aria-label="Cerrar">${ico("x")}</button>
    <form class="manual" id="manual"><input id="manualEan" inputmode="numeric" pattern="[0-9]*" placeholder="o escribe el EAN" aria-label="EAN"><button>Buscar</button></form>`;
  document.body.appendChild(el);
  $("#manual").addEventListener("submit", e => { e.preventDefault(); const v = $("#manualEan").value.trim(); if (v) useCode(v); });
  if (!canCam || !canDet) {
    $("#scanHint").textContent = !canCam ? "La cámara solo funciona abriendo la app desde su dirección https." : "Este navegador no puede leer códigos de barras. Escribe el EAN abajo.";
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    const v = $("#vid"); v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "code_128"] });
    let busy = false;
    scanTimer = setInterval(async () => {
      if (busy || !$("#vid")) return; busy = true;
      try { const r = await det.detect(v); if (r && r.length) { if (navigator.vibrate) navigator.vibrate(60); useCode(r[0].rawValue); } } catch (e) { }
      busy = false;
    }, 200);
  } catch (e) {
    $("#scanHint").textContent = "No tengo permiso para usar la cámara. Actívalo en los ajustes del navegador o escribe el EAN abajo.";
  }
}

/* ===================== eventos ===================== */
document.addEventListener("click", async e => {
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const ok = await copyText(cp.dataset.copy);
    if (ok) {
      cp.classList.add("done"); toast("Copiado " + (cp.dataset.copy.length > 22 ? "" : cp.dataset.copy));
      const swap = cp.querySelector("use"); const old = swap ? swap.getAttribute("href") : null;
      if (swap) swap.setAttribute("href", "#i-check");
      const lab = cp.querySelector(".ph span"); const oldT = lab ? lab.textContent : null; if (lab) lab.textContent = "Copiado";
      setTimeout(() => { cp.classList.remove("done"); if (swap) swap.setAttribute("href", old); if (lab) lab.textContent = oldT; }, 1100);
      const c = cp.closest(".card"); if (c) remember(c.dataset.ref);
    } else toast("No se pudo copiar");
    return;
  }
  const wa = e.target.closest("[data-wa]");
  if (wa) { e.preventDefault(); const c = wa.closest(".card"); if (c) { remember(c.dataset.ref); const it = state.items.find(x => x.ref === c.dataset.ref); if (it) location.href = waLink(it); } return; }
  const sh = e.target.closest("[data-share]"); if (sh) { const c = sh.closest(".card"); if (c) remember(c.dataset.ref); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "close") closeSheet();
  else if (act === "load") { closeSheet(); $("#file").value = ""; $("#file").click(); }
  else if (act === "more") { state.shown += PAGE; render(); }
  else if (act === "clear-recents") { state.recents = []; lsSet("teka_recents", []); render(); }
  else if (act === "stop-scan") stopScan();
  else if (act === "install" && installEvt) { closeSheet(); installEvt.prompt(); installEvt = null; }
});
$("#file").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) loadFile(f); });
$("#btnMenu").addEventListener("click", openMenu);
$("#btnScan").addEventListener("click", () => { if (!state.items.length) return notice("Primero carga la tarifa", "Para buscar por código de barras necesito la tarifa. Cárgala desde el menú."); openScan(); });
$("#btnClear").addEventListener("click", () => { const i = $("#q"); i.value = ""; state.q = ""; state.shown = PAGE; render(); i.focus(); });
let deb; $("#q").addEventListener("input", e => { clearTimeout(deb); deb = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 70); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

/* ===================== arranque ===================== */
(async function init() {
  state.recents = lsGet("teka_recents", []);
  render();
  const saved = await kvGet("tarifa");
  if (saved && saved.items && saved.items.length) { state.items = prepare(saved.items); state.meta = saved.meta; render(); }
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(() => { }); } catch (e) { } }
})();
</script>
</body>
